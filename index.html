<!doctype html>
<html lang="uz" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dars mashqlari — HTML, CSS va JavaScript asoslarini interaktiv mashqlar orqali o'rganish uchun o'quv loyihasi."
    />
    <meta name="author" content="Akramov Axror" />
    <meta name="theme-color" content="#0d1117" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dars mashqlari — O'quv laboratoriyasi" />
    <meta property="og:description" content="Flexbox, animatsiyalar va DOM bo'yicha interaktiv mashqlar." />
    <title>Dars mashqlari — O'quv laboratoriyasi</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('site-theme')
          var prefersLight =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
          var dark = stored ? stored === 'dark' : !prefersLight
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
        <h1>Dars mashqlari</h1>
        <p>Bu saytni ko'rish uchun JavaScript yoqilgan bo'lishi kerak.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
